version: '3'  # version of compose format 

services:
  db:
    image: mongo:7.0
    volumes:
      - brevet-data:/data/db

  calculator:
    build: ./calculator
    command: python -u flask_brevets.py --port 5000
    ports:
      - "5002:5000"
    depends_on:
      - db

  laptop-service:
    build:
      context: ./laptop
      dockerfile: ../calculator/Dockerfile
    command: python -u api.py
    ports:
      - "5001:80"
    depends_on:
      - db

  website:
    image: php:apache
    volumes:
      - ./website:/var/www/html
    ports:
      - "5003:80"
    depends_on:
      - laptop-service

volumes:
  brevet-data: